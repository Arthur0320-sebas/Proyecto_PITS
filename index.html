<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pits Admin</title>
<link rel="stylesheet" href="styles.css">
<style>
.ticket-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.btn.blue{background:#1769e0;color:#fff}
.pits-ticket{background:#fff;border:1px solid #e1e5ea;border-radius:14px;padding:24px;color:#14213d}
.ticket-top{display:flex;align-items:center;justify-content:space-between;gap:15px}
.ticket-logo{width:62%;max-width:620px;height:190px;object-fit:contain}
.ticket-date{text-align:right;color:#26364d;font-size:14px;line-height:1.45}
.pits-ticket h2{font-size:22px;margin:8px 0 14px}
.pits-ticket h3{font-size:19px;margin:20px 0 10px}
.ticket-meta{line-height:1.6;margin-bottom:18px}
.ticket-balances{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ticket-balance{border:1px solid #ddd;border-radius:10px;padding:14px 16px}
.ticket-balance span{font-size:13px;color:#666}
.ticket-balance b{display:block;font-size:28px;margin-top:5px}
.ticket-balance.pending{background:#fff2f2;border-color:#ffc4c4}.ticket-balance.pending b{color:#d71920}
.ticket-balance.credit{background:#f0fff5;border-color:#b8e8c9}.ticket-balance.credit b{color:#117a3b}
.ticket-table-wrap{overflow:auto;border:1px solid #d7dee7;border-radius:9px}
.ticket-table{width:100%;border-collapse:collapse;font-size:12px}
.ticket-table th,.ticket-table td{border-bottom:1px solid #d7dee7;padding:9px 8px;text-align:left;vertical-align:top}
.ticket-table th{background:#f3f6f9}
.ticket-debt{color:#d71920;font-weight:700}
.ticket-note{margin-top:14px;background:#eef8ff;border:1px solid #a9dcff;border-radius:9px;padding:11px;color:#155b86;font-size:13px}
.ticket-footer{height:145px;display:flex;align-items:flex-end;justify-content:space-between;overflow:hidden}
.thanks{font-family:"Brush Script MT","Segoe Script",cursive;font-size:34px;line-height:1.05;color:#14213d;transform:rotate(-4deg);padding-left:8px}
.ticket-watermark{width:280px;opacity:.10}
@media(max-width:800px){.ticket-balances{grid-template-columns:1fr}.ticket-logo{width:75%;height:150px}.ticket-date{font-size:12px}.ticket-table{font-size:11px}}
</style>
</head>

<main>

<script src="datos_iniciales.js"></script>
<script>
const KEY="pits_admin_v11_cero_REAL_20260830";
const TODAY=()=>new Date().toLocaleDateString("en-CA");
let agendaDate=TODAY();
const money=n=>new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN",maximumFractionDigits:0}).format(Number(n)||0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const defaultData={
 clients:[],
 appointments:[],
 payments:[],
 expenses:[],
 employeePayments:[],
 employees:[
  {id:"e1",name:"Saul",rate:50},
  {id:"e2",name:"Mere",rate:45},
  {id:"e3",name:"Genaro",rate:40}
 ],
 cash:{efectivo:0,banco:0},
 closings:[],
 services:[
  {id:"auto_lavado",vehicle:"Auto",size:"",name:"Lavado aspirado",price:180},
  {id:"auto_encerado",vehicle:"Auto",size:"",name:"Encerado",price:280},
  {id:"auto_pulido",vehicle:"Auto",size:"",name:"Pulido",price:1000},
  {id:"auto_vestiduras",vehicle:"Auto",size:"",name:"Vestiduras",price:1000},
  {id:"auto_faros",vehicle:"Auto",size:"",name:"Pulida de faros",price:0},
  {id:"cam_med_lavado",vehicle:"Camioneta",size:"Mediana",name:"Lavado aspirado",price:200},
  {id:"cam_gra_lavado",vehicle:"Camioneta",size:"Grande",name:"Lavado aspirado",price:250},
  {id:"cam_xg_lavado",vehicle:"Camioneta",size:"Extra grande",name:"Lavado aspirado",price:300},
  {id:"cam_med_enc",vehicle:"Camioneta",size:"Mediana",name:"Encerado",price:430},
  {id:"cam_gra_enc",vehicle:"Camioneta",size:"Grande",name:"Encerado",price:480},
  {id:"cam_xg_enc",vehicle:"Camioneta",size:"Extra grande",name:"Encerado",price:550},
  {id:"cam_med_pul",vehicle:"Camioneta",size:"Mediana",name:"Pulido",price:1400},
  {id:"cam_gra_pul",vehicle:"Camioneta",size:"Grande",name:"Pulido",price:1600},
  {id:"cam_xg_pul",vehicle:"Camioneta",size:"Extra grande",name:"Pulido",price:1800},
  {id:"cam_med_vest",vehicle:"Camioneta",size:"Mediana",name:"Vestiduras",price:1400},
  {id:"cam_gra_vest",vehicle:"Camioneta",size:"Grande",name:"Vestiduras",price:1600},
  {id:"cam_xg_vest",vehicle:"Camioneta",size:"Extra grande",name:"Vestiduras",price:1800},
  {id:"cam_med_far",vehicle:"Camioneta",size:"Mediana",name:"Pulida de faros",price:0},
  {id:"cam_gra_far",vehicle:"Camioneta",size:"Grande",name:"Pulida de faros",price:0},
  {id:"cam_xg_far",vehicle:"Camioneta",size:"Extra grande",name:"Pulida de faros",price:0}
 ],
};
let remoteReady=false;
let storedData=null;
try{storedData=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){storedData=null}
// Respaldo local inmediato. El servidor compartido se conecta después.
let data=storedData || structuredClone(window.PITS_SEED_DATA || defaultData);
data.clients??=[]; data.employees??=[]; data.appointments??=[]; data.payments??=[]; data.expenses??=[]; data.employeePayments??=[]; data.tips??=[]; data.closings??=[]; data.cash??={efectivo:0,banco:0};
data.creditTransactions??=[]; data.recurring??=[]; data.clients.forEach(c=>{c.creditBalance=+(c.creditBalance||0)});
data.employees.length||(data.employees=structuredClone(defaultData.employees));
data.services=structuredClone(defaultData.services);
data.appointments.forEach(a=>{a.employeeIds??=[];a.status??="scheduled";a.paymentStatus??="pending";a.commissions??=[];a.courtesy??=false;});
materializeRecurring();
// No guardar automáticamente aquí.
// Primero se cargan los datos reales desde PostgreSQL.
save();

let saveQueue=Promise.resolve();
function save(){
 localStorage.setItem(KEY,JSON.stringify(data));
 if(remoteReady){
  const payload=JSON.stringify(data);
  saveQueue=saveQueue.then(()=>fetch("/api/state",{
    method:"PUT",
    headers:{"Content-Type":"application/json"},
    body:payload,
    keepalive:true
  })).then(r=>{
    if(!r.ok)throw new Error("HTTP "+r.status);
  }).catch(e=>{
    console.warn("No se pudo sincronizar en este momento:",e);
  });
 }
}
async function loadSharedData(){

  try {

    const r = await fetch("/api/state");

    if(!r.ok){
      throw new Error("Servidor no disponible");
    }

    const remote = await r.json();

if (
    remote &&
    remote.ok === true &&
    remote.data &&
    typeof remote.data === "object"
) {
    data = remote.data;

    localStorage.setItem(
        KEY,
        JSON.stringify(data)
    );
}
    remoteReady = true;

    // SI LA BASE DE DATOS ESTÁ VACÍA,
    // SUBIR LOS DATOS ACTUALES DEL NAVEGADOR
    if(
      !remote ||
      typeof remote !== "object" ||
      Object.keys(remote).length === 0
    ){

      save();

    }

    render();

  } catch(e){

    console.warn(
      "Modo local temporal:",
      e
    );

    remoteReady = true;

  }

}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function client(id){return data.clients.find(c=>c.id===id)}
function appointment(id){return data.appointments.find(a=>a.id===id)}
function paymentBelongsToDate(p,date){
 const a=appointment(p.appointmentId);
 return a ? a.date===date : p.date===date;
}
function tipBelongsToDate(t,date){
 const a=appointment(t.appointmentId);
 return a ? a.date===date : t.date===date;
}
function employee(id){return data.employees.find(e=>e.id===id)}
function apptPaid(id){return data.payments.filter(p=>p.appointmentId===id).reduce((s,p)=>s+(+p.amount||0),0)}
function apptCreditApplied(id){return data.creditTransactions.filter(t=>t.type==="apply"&&t.appointmentId===id).reduce((s,t)=>s+(+t.amount||0),0)}
function apptDue(id){const a=appointment(id);return a?Math.max(0,(+a.total||0)-apptPaid(id)-apptCreditApplied(id)):0}
function isPaid(id){return apptDue(id)<=0 && (+appointment(id)?.total||0)>0}
function pending(){return data.appointments.filter(a=>!a.courtesy&&((+a.total||0)>0)&&apptDue(a.id)>0&&a.status!=="cancelled")}
function employeeActive(id){
 return data.appointments.filter(a=>a.status==="in_progress" && a.status!=="cancelled" && (a.employeeIds||[]).includes(id));
}
function setAppointmentStatus(id,status){
 const a=appointment(id); if(!a)return;
 a.status=status;
 if(status!=="in_progress" && status!=="completed") a.commissions=a.commissions||[];
 if(status==="completed" && a.total && (a.employeeIds||[]).length) a.commissions=commissionsFor(a);
 if(status==="completed") applyClientCredit(a);
 save(); closeModal(); render("agenda");
}
function employeeJobs(id){return data.appointments.filter(a=>a.date===TODAY()&&a.status==="completed"&&(a.employeeIds||[]).includes(id))}
function employeeJobsForDate(id,date){return data.appointments.filter(a=>a.date===date&&a.status==="completed"&&(a.employeeIds||[]).includes(id))}
function employeeTipsForDate(id,date){return data.tips.filter(t=>t.employeeId===id&&t.date===date).reduce((s,t)=>s+(+t.amount||0),0)}
function empStatsForDate(id,date){
 let base=0,due=0,ownerGain=0,courtesy=0;
 data.appointments.filter(a=>a.date===date&&a.status==="completed").forEach(a=>{
   (a.commissions||commissionsFor(a)).forEach(x=>{
     if(x.employeeId===id){
       base+=+x.base||0; due+=+x.pay||0;
       if(a.courtesy)courtesy+=+x.pay||0;
       else ownerGain+=(+x.base||0)-(+x.pay||0);
     }
   });
 });
 const paid=data.employeePayments.filter(p=>p.employeeId===id&&p.date===date).reduce((s,p)=>s+(+p.amount||0),0);
 return {base,due,ownerGain,courtesy,paid,pending:Math.max(0,due-paid)}
}
function employeeAccountDates(id){
 const dates=new Set();
 data.appointments.filter(a=>(a.employeeIds||[]).includes(id)&&a.date).forEach(a=>dates.add(a.date));
 data.employeePayments.filter(p=>p.employeeId===id&&p.date).forEach(p=>dates.add(p.date));
 data.tips.filter(t=>t.employeeId===id&&t.date).forEach(t=>dates.add(t.date));
 return [...dates].sort((a,b)=>b.localeCompare(a));
}
function openEmployeePast(id,date){
 const e=employee(id),st=empStatsForDate(id,date),jobs=employeeJobsForDate(id,date),tips=employeeTipsForDate(id,date);
 showModal(`Cuenta de ${esc(e.name)} · ${date}`,`<div class="employee-account-top">
 <b>Generado ${money(st.base)}</b><b>Le toca ${money(st.due)}</b><b>Mi ganancia ${money(st.ownerGain)}</b><b>Cortesías ${money(st.courtesy)}</b><b>Propinas ${money(tips)}</b><b>Pagado ${money(st.paid)}</b><b>Pendiente ${money(st.pending)}</b></div>
 <h3>Carros realizados ese día</h3><div class="history">${jobs.map(a=>{const x=(a.commissions||commissionsFor(a)).find(x=>x.employeeId===id);return `<div class="history-item"><div><b>${esc(client(a.clientId)?.name||"Cliente")}</b><small>${a.date}</small></div><span>${esc(a.vehicleType||"")} ${esc(a.vehicleSize||"")}</span><span>${esc(a.serviceName||"")}</span><strong>Le toca ${money(x?.pay||0)}</strong></div>`}).join("")||`<div class="empty">Sin carros terminados ese día.</div>`}</div>
 <div class="modal-actions"><button class="btn ghost" onclick="openEmployee('${id}')">← Volver a cuenta actual</button></div>`);
}

function commissionsFor(a){
 const ids=a.employeeIds||[]; const baseTotal=a.courtesy?(+a.courtesyBase||0):(+a.total||0); if(!baseTotal||!ids.length)return [];
 const share=baseTotal/ids.length;
 return ids.map(id=>{const e=employee(id);return {employeeId:id,base:share,pay:share*(e?.rate||0)/100}})
}
function empStats(id){
 let base=0,due=0,ownerGain=0,courtesy=0;
 data.appointments.filter(a=>a.date===TODAY()&&a.status==="completed").forEach(a=>(a.commissions||commissionsFor(a)).forEach(x=>{
   if(x.employeeId===id){
     base+=x.base||0;
     due+=x.pay||0;
     if(a.courtesy){courtesy+=x.pay||0;}
     else{ownerGain+=(x.base||0)-(x.pay||0);}
   }
 }));
 const paid=data.employeePayments.filter(p=>p.employeeId===id&&p.date===TODAY()).reduce((s,p)=>s+(+p.amount||0),0);
 return {base,due,ownerGain,courtesy,paid,pending:Math.max(0,due-paid)}
}
function tipTotal(){return data.tips.reduce((s,t)=>s+(+t.amount||0),0)}
function employeeTips(id){return data.tips.filter(t=>t.employeeId===id&&t.date===TODAY()).reduce((s,t)=>s+(+t.amount||0),0)}
function employeeTodaySalary(id){return data.appointments.filter(a=>a.date===TODAY()&&a.status==="completed").reduce((s,a)=>(a.commissions||commissionsFor(a)).filter(x=>x.employeeId===id).reduce((z,x)=>z+x.pay,s),0)}
function totalEmployeeTodaySalary(){return data.employees.reduce((s,e)=>s+employeeTodaySalary(e.id),0)}
function totalEmployeePaymentsToday(){return data.employeePayments.filter(p=>p.date===TODAY()).reduce((s,p)=>s+(+p.amount||0),0)}
function totalTipsToday(){return data.tips.filter(t=>t.date===TODAY()).reduce((s,t)=>s+(+t.amount||0),0)}
function serviceCollectedToday(){return data.payments.filter(p=>p.date===TODAY()).reduce((s,p)=>s+(+p.amount||0),0)}

function clientCredit(id){return +(client(id)?.creditBalance||0)}
function addClientCredit(clientId,amount,method,note=""){
 const c=client(clientId); amount=+amount||0; if(!c||amount<=0)return false;
 c.creditBalance=(+c.creditBalance||0)+amount;
 data.creditTransactions.push({id:uid(),type:"add",clientId,amount,method,date:TODAY(),note:note||"Pago anticipado"});
 if(method==="Efectivo")data.cash.efectivo+=amount;else data.cash.banco+=amount;
 save(); return true;
}
function applyClientCredit(a){
 if(!a||a.courtesy||a.status!=="completed"||!(+a.total))return 0;
 const c=client(a.clientId); if(!c||clientCredit(c.id)<=0)return 0;
 const remaining=Math.max(0,(+a.total||0)-apptPaid(a.id)-apptCreditApplied(a.id));
 if(remaining<=0)return 0;
 const use=Math.min(clientCredit(c.id),remaining);
 c.creditBalance=clientCredit(c.id)-use;
 data.creditTransactions.push({id:uid(),type:"apply",clientId:c.id,appointmentId:a.id,amount:use,date:TODAY(),note:"Aplicado al servicio"});
 a.paymentStatus=apptDue(a.id)<=0?"paid":"partial";
 return use;
}
function openAddCredit(clientId){
 const c=client(clientId); if(!c)return;
 showModal("Agregar saldo a favor",`<div class="form-grid">
  <label class="wide">Cliente<input value="${esc(c.name)}" disabled></label>
  <label>Monto a favor<input id="credit_amount" type="number" min="1" placeholder="Ej. 500"></label>
  <label>Forma de pago<select id="credit_method"><option>Efectivo</option><option>Transferencia</option></select></label>
  <label class="wide">Nota<input id="credit_note" placeholder="Ej. Pago por adelantado"></label>
 </div><div class="note">Este dinero se registra como recibido hoy y queda como saldo a favor. Al finalizar un servicio, el saldo se descuenta automáticamente.</div>
 <div class="modal-actions"><button class="btn red" onclick="saveCredit('${clientId}')">Guardar saldo</button></div>`);
}
function saveCredit(clientId){
 const amount=+document.getElementById("credit_amount").value||0,method=document.getElementById("credit_method").value,note=document.getElementById("credit_note").value;
 if(!addClientCredit(clientId,amount,method,note))return alert("Escribe un monto válido.");
 closeModal();openClient(clientId);
}
function creditHistory(clientId){
 return data.creditTransactions.filter(t=>t.clientId===clientId).sort((a,b)=>((b.date||"")+b.id).localeCompare((a.date||"")+a.id)).map(t=>`<div class="credit-row"><span>${t.date}</span><b>${t.type==="add"?"Saldo agregado":"Aplicado al servicio"}</b><strong>${t.type==="add"?"+":"-"}${money(t.amount)}</strong><small>${esc(t.note||"")}</small>${t.type==="add"?`<button class="mini redtxt" onclick="deleteCredit('${t.id}')">🗑 Borrar</button>`:""}</div>`).join("")||`<div class="empty">Sin movimientos de saldo a favor.</div>`;
}
function deleteCredit(id){
 const t=data.creditTransactions.find(x=>x.id===id); if(!t)return;
 if(t.type!=="add")return alert("Este movimiento ya fue aplicado a un servicio y no se puede borrar desde aquí.");
 if(!confirm("¿Borrar este saldo a favor? También se revertirá el dinero registrado en caja."))return;
 const c=client(t.clientId);
 if(c)c.creditBalance=Math.max(0,clientCredit(c.id)-(+t.amount||0));
 if(t.method==="Efectivo")data.cash.efectivo-=+t.amount||0;else data.cash.banco-=+t.amount||0;
 data.creditTransactions=data.creditTransactions.filter(x=>x.id!==id);
 save();
 closeModal();
 render("clientes");

function clientPendingAppointments(clientId){
 const c=client(clientId);
 if(!c)return [];
 return data.appointments
   .filter(a=>a.clientId===clientId&&a.status!=="cancelled"&&apptDue(a.id)>0)
   .sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
}

function clientTicketData(clientId){
 const c=client(clientId);
 const aa=clientPendingAppointments(clientId);
 const debt=aa.reduce((s,a)=>s+apptDue(a.id),0);
 const credit=clientCredit(clientId);
 return {c,aa,debt,credit};
}

function ticketPaidText(a){
 const pays=data.payments.filter(p=>p.appointmentId===a.id);
 const used=apptCreditApplied(a.id);
 const parts=pays.map(p=>`${p.method} ${money(p.amount)}`);
 if(used)parts.push(`Crédito ${money(used)}`);
 return parts.join(" + ")||"Sin pago";
}

function ticketHtml(clientId){
 const {c,aa,debt,credit}=clientTicketData(clientId);
 if(!c)return "";
 const now=new Date();
 const dateText=now.toLocaleDateString("es-MX");
 const timeText=now.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"});
 const rows=aa.map(a=>`
   <tr>
    <td>${esc(a.date)}</td>
    <td>${esc((a.vehicleType||"Vehículo")+(a.vehicleSize?" "+a.vehicleSize:""))}</td>
    <td>${esc(a.serviceName||"Servicio")}</td>
    <td>${money(a.total)}</td>
    <td>${esc(ticketPaidText(a))}</td>
    <td class="ticket-debt">Debe ${money(apptDue(a.id))}</td>
   </tr>`).join("");

 return `<div class="pits-ticket">
   <div class="ticket-top">
     <img class="ticket-logo" src="${PITS_LOGO_DATA}" alt="Autolavado Pits">
     <div class="ticket-date">${dateText}<br>${timeText}</div>
   </div>
   <h2>Resumen de cuenta del cliente</h2>
   <div class="ticket-meta">
    <div><b>Cliente:</b> ${esc(c.name)}</div>
    <div><b>Dirección:</b> ${esc(c.address||"-")}</div>
    <div><b>Teléfono:</b> ${esc(c.phone||"-")}</div>
   </div>
   <div class="ticket-balances">
    <div class="ticket-balance pending"><span>Total pendiente</span><b>${money(debt)}</b></div>
    <div class="ticket-balance credit"><span>Saldo a favor</span><b>${money(credit)}</b></div>
   </div>
   <h3>Detalle de servicios pendientes</h3>
   <div class="ticket-table-wrap"><table class="ticket-table">
    <thead><tr><th>Fecha</th><th>Vehículo</th><th>Servicio</th><th>Importe</th><th>Pagos</th><th>Estado</th></tr></thead>
    <tbody>${rows||`<tr><td colspan="6">No hay servicios pendientes.</td></tr>`}</tbody>
   </table></div>
   <div class="ticket-note">ⓘ Este ticket muestra únicamente los servicios que tienen un saldo <b>pendiente</b>.</div>
   <div class="ticket-footer">
    <div class="thanks">¡Gracias por<br>tu confianza!</div>
    <img src="${PITS_LOGO_DATA}" alt="" class="ticket-watermark">
   </div>
 </div>`;
}

function openClientTicket(clientId){
 const c=client(clientId);
 if(!c)return;
 showModal("Resumen de cuenta",`
   <div class="ticket-actions">
    <button class="btn red" onclick="downloadClientPDF('${clientId}')">📄 Descargar PDF</button>
    <button class="btn blue" onclick="downloadClientImage('${clientId}')">🖼 Descargar imagen</button>
    <button class="mini" onclick="printClientSummary('${clientId}')">🖨 Imprimir</button>
   </div>
   ${ticketHtml(clientId)}
 `);
}

function downloadClientPDF(clientId){
 const c=client(clientId);
 if(!c)return;
 const w=window.open("","_blank");
 if(!w){alert("Permite ventanas emergentes para guardar el PDF.");return;}
 w.document.open();
 w.document.write(`<!doctype html><html lang="es"><head><meta charset="utf-8">
 <title>Cuenta por cobrar - ${esc(c.name)}</title>
 <style>
 *{box-sizing:border-box}
 body{margin:0;background:#eef2f5;font-family:Arial,Helvetica,sans-serif;color:#14213d}
 .pits-ticket{width:1100px;max-width:calc(100vw - 40px);margin:25px auto;background:#fff;padding:38px 42px;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.10)}
 .ticket-top{display:flex;align-items:center;justify-content:space-between;gap:20px}
 .ticket-logo{width:610px;max-width:68%;height:220px;object-fit:contain;object-position:center}
 .ticket-date{text-align:right;font-size:15px;line-height:1.45;color:#26364d}
 h2{font-size:25px;margin:4px 0 16px}
 h3{font-size:22px;margin:25px 0 13px}
 .ticket-meta{font-size:17px;line-height:1.65;margin-bottom:22px}
 .ticket-balances{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:24px}
 .ticket-balance{border:1px solid #ddd;border-radius:12px;padding:18px 22px}
 .ticket-balance span{display:block;font-size:14px;color:#666}
 .ticket-balance b{display:block;font-size:34px;margin-top:7px}
 .ticket-balance.pending{background:#fff2f2;border-color:#ffc4c4}.ticket-balance.pending b{color:#d71920}
 .ticket-balance.credit{background:#f0fff5;border-color:#b8e8c9}.ticket-balance.credit b{color:#117a3b}
 .ticket-table-wrap{overflow:hidden;border:1px solid #d7dee7;border-radius:10px}
 .ticket-table{width:100%;border-collapse:collapse;font-size:13px}
 .ticket-table th,.ticket-table td{border-bottom:1px solid #d7dee7;padding:11px 10px;text-align:left;vertical-align:top}
 .ticket-table th{background:#f3f6f9;font-weight:700}
 .ticket-table tr:last-child td{border-bottom:0}
 .ticket-debt{color:#d71920;font-weight:700}
 .ticket-note{margin-top:18px;background:#eef8ff;border:1px solid #a9dcff;border-radius:10px;padding:13px 16px;color:#155b86;font-size:14px}
 .ticket-footer{height:180px;display:flex;align-items:flex-end;justify-content:space-between;overflow:hidden;margin-top:8px}
 .thanks{font-family:"Brush Script MT","Segoe Script",cursive;font-size:43px;line-height:1.05;color:#14213d;transform:rotate(-4deg);padding-left:12px}
 .ticket-watermark{width:390px;opacity:.10;filter:saturate(.7)}
 @media print{
   @page{size:A4 landscape;margin:8mm}
   body{background:#fff}
   .pits-ticket{width:auto;max-width:none;margin:0;box-shadow:none;border-radius:0;padding:12px}
   .ticket-actions{display:none}
 }
 </style></head><body>${ticketHtml(clientId)}
 <script>window.onload=function(){setTimeout(function(){window.print()},300)}<\/script>
 </body></html>`);
 w.document.close();
}

function downloadClientImage(clientId){
 const {c,aa,debt,credit}=clientTicketData(clientId);
 if(!c)return;
 const canvas=document.createElement("canvas");
 const ctx=canvas.getContext("2d");
 const W=1400, rowH=78, tableH=78+aa.length*rowH, footerH=235, H=660+tableH+25+footerH+45;
 canvas.width=W;canvas.height=H;
 ctx.fillStyle="#ffffff";ctx.fillRect(0,0,W,H);
 ctx.fillStyle="#14213d";
 ctx.font="700 30px Arial";
 ctx.fillText("Resumen de cuenta del cliente",70,335);

 const logoImg=new Image();
 logoImg.onload=function(){
   const maxW=850,maxH=255;
   const ratio=Math.min(maxW/logoImg.width,maxH/logoImg.height);
   const lw=logoImg.width*ratio,lh=logoImg.height*ratio;
   ctx.drawImage(logoImg,70,30,lw,lh);
   ctx.fillStyle="#26364d";ctx.font="18px Arial";ctx.textAlign="right";
   const now=new Date();
   ctx.fillText(now.toLocaleDateString("es-MX"),W-70,75);
   ctx.fillText(now.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"}),W-70,103);
   ctx.textAlign="left";

   ctx.font="700 19px Arial";
   ctx.fillStyle="#14213d";
   ctx.fillText("Cliente:",70,385);ctx.font="19px Arial";ctx.fillText(c.name||"-",155,385);
   ctx.font="700 19px Arial";ctx.fillText("Dirección:",70,418);ctx.font="19px Arial";ctx.fillText(c.address||"-",180,418);
   ctx.font="700 19px Arial";ctx.fillText("Teléfono:",70,451);ctx.font="19px Arial";ctx.fillText(c.phone||"-",170,451);

   drawBox(ctx,70,480,600,105,"#fff2f2","#ffc4c4","#d71920","Total pendiente",money(debt));
   drawBox(ctx,700,480,630,105,"#f0fff5","#b8e8c9","#117a3b","Saldo a favor",money(credit));

   ctx.fillStyle="#14213d";ctx.font="700 27px Arial";ctx.fillText("Detalle de servicios pendientes",70,630);

   const x=[70,240,485,775,945,1110,1330];
   const y0=660;
   ctx.fillStyle="#f3f6f9";roundRect(ctx,70,y0,1260,58,10);ctx.fill();
   ctx.fillStyle="#14213d";ctx.font="700 16px Arial";
   ["Fecha","Vehículo","Servicio","Importe","Pagos","Estado"].forEach((t,i)=>ctx.fillText(t,x[i]+12,y0+36));
   ctx.font="15px Arial";
   aa.forEach((a,i)=>{
     const y=y0+58+i*rowH;
     ctx.strokeStyle="#d7dee7";ctx.strokeRect(70,y,1260,rowH);
     const vehicle=(a.vehicleType||"Vehículo")+(a.vehicleSize?" "+a.vehicleSize:"");
     const pay=ticketPaidText(a);
     const vals=[a.date,vehicle,a.serviceName||"Servicio",money(a.total),pay,"Debe "+money(apptDue(a.id))];
     vals.forEach((v,j)=>{
       ctx.fillStyle=j===5?"#d71920":"#26364d";
       ctx.font=j===5?"700 15px Arial":"15px Arial";
       drawWrapped(ctx,String(v),x[j]+12,y+29,(x[j+1]-x[j])-20,18);
     });
   });
   const noteY=y0+58+aa.length*rowH+25;
   ctx.fillStyle="#eef8ff";roundRect(ctx,70,noteY,1260,58,10);ctx.fill();

function drawBox(ctx,x,y,w,h,bg,border,textColor,label,value){
 ctx.fillStyle=bg;ctx.strokeStyle=border;ctx.lineWidth=1;roundRect(ctx,x,y,w,h,12);ctx.fill();ctx.stroke();
 ctx.fillStyle="#555";ctx.font="16px Arial";ctx.fillText(label,x+22,y+30);
 ctx.fillStyle=textColor;ctx.font="700 34px Arial";ctx.fillText(value,x+22,y+72);
}
function roundRect(ctx,x,y,w,h,r){
 ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawWrapped(ctx,text,x,y,maxWidth,lineHeight){
 const words=text.split(/\s+/);let line="";
 for(const word of words){
   const test=line?line+" "+word:word;
   if(ctx.measureText(test).width>maxWidth&&line){ctx.fillText(line,x,y);line=word;y+=lineHeight}else line=test;
 }
 if(line)ctx.fillText(line,x,y);
}

function agenda(){

 const startHour=6,endHour=23,pxHour=78;
 const lanes=[];
 const positioned=arr.map(a=>{
   const [hh,mm]=(a.time||"08:00").split(":").map(Number);
   const start=(hh*60+mm)-(startHour*60);
   let duration=60;
   if(a.time&&a.endTime){const [eh,em]=a.endTime.split(":").map(Number);const endMinutes=eh*60+em;const startMinutes=hh*60+mm;if(endMinutes>startMinutes)duration=endMinutes-startMinutes;}
   const end=start+duration;
   let lane=0; while(lanes[lane]!==undefined&&lanes[lane]>start)lane++; lanes[lane]=end;
   return {...a,top:Math.max(0,start/60*pxHour),height:Math.max(58,duration/60*pxHour-6),lane};
 });
 const laneCount=Math.max(1,lanes.length);
 const hours=Array.from({length:endHour-startHour+1},(_,i)=>`<div class="agenda-hour" style="top:${i*pxHour}px">${String(startHour+i).padStart(2,"0")}:00</div>`).join("");

 }).join("");
 const pretty=new Date(selected+"T12:00:00").toLocaleDateString("es-MX",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});
 return `<div class="toolbar"><div><b>Agenda</b><span class="muted">${pretty}</span></div><div><button class="mini" onclick="openRecurring()">↻ Programar cliente</button> <button class="btn red" onclick="newAppointment('', '${selected}')">+ Nueva cita</button></div></div>

}

function clientes(){
 return `<div class="toolbar"><div><b>Clientes registrados</b><span class="muted">Todos aparecen aquí. No necesitas buscarlos.</span></div><button class="btn red" onclick="openClient()">+ Nuevo cliente</button></div>
 <div class="panel" id="clientList"></div>`;

function normalizeClientText(v){
 return String(v||"").toLowerCase().normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").replace(/[^a-z0-9]/g,"");
}
function possibleDuplicateClients(c){
 const n=normalizeClientText(c.name), phone=normalizeClientText(c.phone), address=normalizeClientText(c.address);
 return data.clients.some(x=>{
   if(x.id===c.id)return false;
   const xn=normalizeClientText(x.name), xp=normalizeClientText(x.phone), xa=normalizeClientText(x.address);
   const sameName=n&&xn&&(n===xn||n.startsWith(xn)||xn.startsWith(n));
   const sameContact=(phone&&xp&&phone===xp)||(address&&xa&&address===xa);
   return sameName&&sameContact;
 });
}
function editClient(id){openClient(id);}
function deleteClient(id){
 const c=client(id);
 if(!c)return;

   : `¿Eliminar al cliente "${c.name}"?`;
 if(!confirm(message))return;
 if(aa.length){
   alert("No se eliminó porque tiene citas o historial. Así evitamos perder datos.");
   return;
 }
 data.clients=data.clients.filter(x=>x.id!==id);

function saveClient(id){
 const name=document.getElementById("c_name").value.trim(),address=document.getElementById("c_address").value.trim(),phone=document.getElementById("c_phone").value.trim();
 if(!name)return alert("Escribe el nombre del cliente.");
 const dup=data.clients.find(c=>c.name.trim().toLowerCase()===name.toLowerCase()&&c.id!==id);
 if(dup)return alert(`⚠️ Este cliente ya existe: ${dup.name}.\\nDirección: ${dup.address}`);
 const similar=data.clients.find(c=>{
   if(c.id===id)return false;
   const n=normalizeClientText(name), cn=normalizeClientText(c.name);
   const p=normalizeClientText(phone), cp=normalizeClientText(c.phone);
   const ad=normalizeClientText(address), cad=normalizeClientText(c.address);
   const similarName=n&&cn&&(n===cn||n.startsWith(cn)||cn.startsWith(n));
   const sameContact=(p&&cp&&p===cp)||(ad&&cad&&ad===cad);
   return similarName&&sameContact;
 });
 if(similar&&!confirm(`⚠️ Posible cliente repetido: ${similar.name}.\\n\\nNombre: ${name}\\nDirección: ${address||"Sin dirección"}\\n\\n¿Guardar de todos modos?`))return;
 if(id)Object.assign(client(id),{name,address,phone});else data.clients.push({id:uid(),name,address,phone});
 save();closeModal();render("clientes");renderClientList();
}

function openPayment(pre=""){
 const preAppt=pre?appointment(pre):null;
 const targetDate=preAppt?.date||pagosDate;
 const dayList=data.appointments.filter(a=>a.date===targetDate&&a.status!=="cancelled"&&!a.courtesy);
 const dayPendingList=dayList.filter(a=>apptDue(a.id)>0);
 const list=preAppt&&dayList.some(a=>a.id===preAppt.id)
  ? [preAppt,...dayPendingList.filter(a=>a.id!==preAppt.id)]
  : dayPendingList;
 const selected=list.find(a=>a.id===pre)||list[0];
 showModal("Registrar pago",selected?`<div class="form-grid">
 <label class="wide">Servicio pendiente<select id="p_appt" onchange="paymentAmount()">${list.map(a=>`<option value="${a.id}" ${a.id===selected.id?'selected':''}>${esc(client(a.clientId)?.name||"Cliente")} · ${esc(a.serviceName||"Servicio")} · Debe ${money(apptDue(a.id))}</option>`).join("")}</select></label>
 <label>Monto recibido<input id="p_amount" type="number" value="${apptDue(selected.id)}" oninput="updatePaymentTip()"></label>
 <label>Forma de pago<select id="p_method"><option>Efectivo</option><option>Transferencia</option></select></label>
 <label>Fecha<input id="p_date" type="date" value="${targetDate}"></label> <div class="wide note">Saldo a favor disponible: <b>${money(clientCredit(selected.clientId))}</b>. Al registrar el pago, se utilizará primero para cubrir el servicio.</div>
 <div class="wide payment-tip-box"><span>🎁 Propina detectada</span><b id="p_tip">$0</b><small>Si recibes más que el importe, la diferencia se registra como propina.</small></div>
 <label class="wide">Propina para<div class="checks">${(selected.employeeIds||[]).map(id=>`<label class="check"><input type="checkbox" name="tipemp" value="${id}" checked> ${esc(employee(id)?.name||"Empleado")}</label>`).join("")||`<span class="muted">No hay empleado asignado a este servicio.</span>`}</div></label>
 </div>
 <div class="note">Ejemplo: servicio $180, recibes $200 → $180 se registra como ingreso del servicio y $20 como propina. La propina se paga en efectivo y se descuenta de Caja.</div>
 <div class="modal-actions"><button class="btn red" onclick="savePayment()">Registrar pago</button></div>`:`<div class="empty">No hay cuentas pendientes de pago.</div>`);
 updatePaymentTip();
}
function editPayment(id){
 const p=data.payments.find(x=>x.id===id);
 if(!p)return;
 const a=appointment(p.appointmentId);
 const c=client(p.clientId||a?.clientId);
 showModal("Editar pago",`<div class="form-grid">
   <div class="wide note"><b>${esc(c?.name||"Cliente")}</b> · ${esc(a?.serviceName||"Servicio")} · ${money(p.amount)}</div>
   <label>Forma de pago<select id="edit_p_method"><option ${p.method==="Efectivo"?"selected":""}>Efectivo</option><option ${p.method==="Transferencia"?"selected":""}>Transferencia</option></select></label>
 </div>
 <div class="note">Puedes corregir la forma de pago sin volver a crear la cita ni registrar nuevamente el cobro.</div>
 <div class="modal-actions"><button class="btn red" onclick="saveEditedPayment('${p.id}')">Guardar cambio</button></div>`);
}
function saveEditedPayment(id){
 const p=data.payments.find(x=>x.id===id);
 if(!p)return;
 const next=document.getElementById("edit_p_method")?.value;
 if(!next||next===p.method){closeModal();return;}
 const amount=+p.amount||0;
 if(p.method==="Efectivo")data.cash.efectivo=Math.max(0,(+data.cash.efectivo||0)-amount);
 if(p.method==="Transferencia")data.cash.banco=Math.max(0,(+data.cash.banco||0)-amount);
 if(next==="Efectivo")data.cash.efectivo=(+data.cash.efectivo||0)+amount;
 if(next==="Transferencia")data.cash.banco=(+data.cash.banco||0)+amount;
 p.method=next;
 save();closeModal();render("pagos");
}
function paymentAmount(){const a=appointment(document.getElementById("p_appt").value);document.getElementById("p_amount").value=apptDue(a.id);updatePaymentTip()}
function updatePaymentTip(){
 const a=appointment(document.getElementById("p_appt")?.value),amount=+(document.getElementById("p_amount")?.value||0),tip=Math.max(0,amount-(a?apptDue(a.id):0));
 const el=document.getElementById("p_tip");if(el)el.textContent=money(tip);
}
function savePayment(){
 const a=appointment(document.getElementById("p_appt").value),amount=+document.getElementById("p_amount").value||0,method=document.getElementById("p_method").value;
 const paymentDate=document.getElementById("p_date")?.value||pagosDate;
 if(!a||!paymentDate){
   alert("No se pudo identificar el servicio o la fecha del pago.");
   return;
 }
 if(a.date!==paymentDate){
   alert("La fecha del pago debe coincidir con la fecha del servicio.");
   return;
 }
 if(amount<=0){
   alert("Ingresa un monto mayor a $0.");
   return;
 }
 let remaining=amount;
 const dueBefore=apptDue(a.id);
 if(dueBefore<=0){
   alert("Este servicio ya está pagado.");
   return;
 }

 // Si el cliente tiene saldo a favor, se usa primero para cubrir este servicio.
 const credit=clientCredit(a.clientId);
 const useCredit=Math.min(credit,dueBefore,remaining);
 if(useCredit>0){
   const c=client(a.clientId);
   c.creditBalance=Math.max(0,credit-useCredit);
   data.creditTransactions.push({id:uid(),type:"apply",clientId:c.id,appointmentId:a.id,amount:useCredit,date:paymentDate,note:"Aplicado al registrar pago"});
   remaining-=useCredit;
 }

 // Solo el dinero realmente recibido hoy entra a efectivo/banco.
 const serviceAmount=Math.min(remaining,Math.max(0,dueBefore-useCredit));
 const tip=Math.max(0,remaining-Math.max(0,dueBefore-useCredit));
 if(serviceAmount>0){
   data.payments.push({id:uid(),appointmentId:a.id,clientId:a.clientId,amount:serviceAmount,method,date:paymentDate});
   if(method==="Efectivo")data.cash.efectivo+=serviceAmount;else data.cash.banco+=serviceAmount;
 }
 if(tip>0){
   const ids=[...document.querySelectorAll('input[name="tipemp"]:checked')].map(x=>x.value);
   const targets=ids.length?ids:(a.employeeIds||[]);
   const share=targets.length?tip/targets.length:tip;
   if(targets.length)targets.forEach(eid=>data.tips.push({id:uid(),appointmentId:a.id,employeeId:eid,amount:share,method:"Efectivo",date:paymentDate}));
   else data.tips.push({id:uid(),appointmentId:a.id,employeeId:"",amount:tip,method:"Efectivo",date:paymentDate});
   data.cash.efectivo-=tip;
 }
 a.paymentStatus=apptDue(a.id)<=0?"paid":"partial";
 save();closeModal();render("pagos");
}

function employeeCard(e){

 <div class="emp-current"><b>Ahora</b>${active.length?active.map(a=>`<div>🚗 ${esc(client(a.clientId)?.name||"Cliente")} · ${esc(a.vehicleType||"")} ${esc(a.vehicleSize||"")} · ${money(a.total)}</div>`).join(""):"<div>Sin vehículo en proceso</div>"}</div>
 <div class="emp-stats"><div><small>Generado</small><b>${money(st.base)}</b></div><div><small>Le toca</small><b>${money(st.due)}</b></div><div><small>Mi ganancia</small><b>${money(st.ownerGain)}</b></div><div><small>Cortesías</small><b>${money(st.courtesy)}</b></div><div><small>Propinas</small><b>${money(employeeTips(e.id))}</b></div><div><small>Pagado</small><b>${money(st.paid)}</b></div><div><small>Debe recibir</small><b class="${st.pending?'danger':'success'}">${money(st.pending)}</b></div></div>

 </div><h3>Carros que ya hizo</h3><div class="history">${employeeJobs(id).map(a=>{const x=(a.commissions||commissionsFor(a)).find(x=>x.employeeId===id);return `<div class="history-item"><div><b>${a.date}</b><small>${esc(client(a.clientId)?.name||"Cliente")}</small></div><span>${esc(a.vehicleType||"")} ${esc(a.vehicleSize||"")}</span><span>${esc(a.serviceName||"")}</span><strong>Le toca ${money(x?.pay||0)}</strong></div>`}).join("")||`<div class="empty">Sin carros terminados.</div>`}</div>
 <div class="modal-actions"><button class="btn green" onclick="openEmployeePayment('${id}')">+ Registrar pago</button></div>`:""}
 <div class="modal-actions"><button class="btn red" onclick="saveEmployee('${id||""}')">Guardar</button></div>`);

function saveEmployeePayment(id){const amount=+document.getElementById("ep_amount").value||0;if(!amount)return;const method=document.getElementById("ep_method").value;data.employeePayments.push({id:uid(),employeeId:id,amount,method,date:document.getElementById("ep_date").value,note:document.getElementById("ep_note").value});if(method==="Efectivo")data.cash.efectivo-=amount;else data.cash.banco-=amount;save();closeModal();render("empleados")}

function caja(){
 const income=data.payments.reduce((s,p)=>s+p.amount,0);
 const cashIncome=data.payments.filter(p=>p.method==="Efectivo").reduce((s,p)=>s+p.amount,0);
 const bankIncome=data.payments.filter(p=>p.method==="Transferencia").reduce((s,p)=>s+p.amount,0);
 const salaries=data.employeePayments.reduce((s,p)=>s+p.amount,0);
 const tips=tipTotal();
 const expenses=data.expenses.reduce((s,p)=>s+p.amount,0);
 return `<div class="grid two">
   <div class="panel opening-balance"><div><b>Saldo inicial del día</b><span class="muted">Dinero que ya tenías antes de comenzar.</span></div><button class="mini" onclick="openOpeningBalance()">💵 Registrar / cambiar</button></div>
   <div class="panel cash-total"><div><span>💰 Dinero Pits actual</span><b>${money(data.cash.efectivo+data.cash.banco)}</b></div><small>Efectivo + banco registrados en el sistema</small></div>
 </div>
 <div class="grid two">
   <div class="panel cash"><span>💵 Efectivo</span><b>${money(data.cash.efectivo)}</b><small>Deberías tener en efectivo</small></div>
   <div class="panel cash"><span>🏦 Transferencias</span><b>${money(data.cash.banco)}</b><small>Deberías tener en banco</small></div>
 </div>
 <div class="panel"><div class="panel-title">Resumen de caja</div>
   <div class="summary"><span>Total de ingresos</span><b>${money(income)}</b></div>
   <div class="summary"><span>💵 Cobrado en efectivo</span><b>${money(cashIncome)}</b></div>
   <div class="summary"><span>🏦 Cobrado en transferencia</span><b>${money(bankIncome)}</b></div>
   <div class="summary"><span>👷 Sueldos</span><b>${money(salaries)}</b></div>
   <div class="summary"><span>🎁 Propinas</span><b>${money(tips)}</b></div>
   <div class="summary"><span>🧾 Gastos</span><b>${money(expenses)}</b></div>
   <div class="summary total"><span>Dinero actual</span><b>${money(data.cash.efectivo+data.cash.banco)}</b></div>
 </div>
 <button class="btn green bigbtn" onclick="openClosing()">🔒 Hacer corte del día</button>
 <div class="closing-tools"><button class="mini" onclick="downloadClosingReport('daily')">⬇ Descargar corte del día</button><button class="mini" onclick="printClosingReport('daily')">🖨 Imprimir corte del día</button><button class="mini" onclick="downloadClosingReport('monthly')">⬇ Descargar corte del mes</button><button class="mini" onclick="printClosingReport('monthly')">🖨 Imprimir corte del mes</button></div>`;

function reportes(){
 const d=TODAY(),daily=data.appointments.filter(a=>a.date===d&&a.status!=="cancelled"),month=d.slice(0,7),ma=data.appointments.filter(a=>a.date?.startsWith(month)&&a.status!=="cancelled"),groups={};
 ma.forEach(a=>{const k=a.serviceName||"Por definir";groups[k]??={importe:0,transfer:0,cash:0,pending:0};groups[k].importe+=+a.total||0;data.payments.filter(p=>p.appointmentId===a.id).forEach(p=>p.method==="Transferencia"?groups[k].transfer+=p.amount:groups[k].cash+=p.amount);groups[k].pending+=apptDue(a.id)});
 return `<div class="report-tabs"><button class="report-tab active" onclick="toggleReport(true)">Diario</button><button class="report-tab" onclick="toggleReport(false)">Mensual</button></div>
 <div id="dailyReport" class="panel"><div class="panel-title">Reporte diario <span><button class="mini" onclick="downloadReport('daily')">⬇ Descargar</button> <button class="btn red" onclick="window.print()">Imprimir</button></span></div><div class="table-wrap"><table><thead><tr><th>Nombre del cliente</th><th>Dirección</th><th>Servicio</th><th>Forma de pago</th><th>Estado</th></tr></thead><tbody>${daily.map(a=>{const c=client(a.clientId),p=data.payments.filter(p=>p.appointmentId===a.id);return `<tr><td>${esc(c?.name)}</td><td>${esc(c?.address)}</td><td>${esc(a.serviceName||"Por definir")}</td><td>${p.map(x=>x.method).join(" + ")||"—"}</td><td><span class="pill ${apptDue(a.id)?'pending':'paid'}">${apptDue(a.id)?"Pendiente":"Pagado"}</span></td></tr>`}).join("")||`<tr><td colspan="5" class="empty">No hay servicios hoy.</td></tr>`}</tbody></table></div></div>
 <div id="monthlyReport" class="panel hidden"><div class="panel-title">Reporte mensual · ${month} <span><button class="mini" onclick="downloadReport('monthly')">⬇ Descargar</button> <button class="btn red" onclick="window.print()">Imprimir</button></span></div><div class="table-wrap"><table><thead><tr><th>Servicio</th><th>Importe</th><th>Transferencia</th><th>Efectivo</th><th>Cuentas por pagar</th></tr></thead><tbody>${Object.entries(groups).map(([k,r])=>`<tr><td>${esc(k)}</td><td>${money(r.importe)}</td><td>${money(r.transfer)}</td><td>${money(r.cash)}</td><td class="${r.pending?'danger':''}">${money(r.pending)}</td></tr>`).join("")||`<tr><td colspan="5" class="empty">No hay servicios este mes.</td></tr>`}</tbody></table></div></div>`;
}
function toggleReport(daily){document.getElementById("dailyReport").classList.toggle("hidden",!daily);document.getElementById("monthlyReport").classList.toggle("hidden",daily);document.querySelectorAll(".report-tab").forEach((b,i)=>b.classList.toggle("active",daily?i===0:i===1))}

function downloadReport(type){
  const month=TODAY().slice(0,7), date=TODAY();
  const rowsDaily=data.appointments.filter(a=>a.date===date&&a.status!=="cancelled");
  const rowsMonth=data.appointments.filter(a=>a.date?.startsWith(month)&&a.status!=="cancelled");
  const escXls=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const moneyXls=n=>Number(n||0).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2});
  let html=`<html><head><meta charset="utf-8"><style>body{font-family:Arial,sans-serif;color:#20262b}h1{font-size:22px}h2{font-size:16px;margin-top:22px}table{border-collapse:collapse;width:100%;margin-bottom:20px}th{background:#e9ecef;font-weight:bold}th,td{border:1px solid #cfd4d8;padding:7px;text-align:left}td.num{text-align:right}.total{font-weight:bold;background:#f5f5f5}.sub{color:#666}</style></head><body><h1>Autolavado Pits</h1>`;
  if(type==="daily"){
    const paymentsDay=data.payments.filter(p=>paymentBelongsToDate(p,date));
    const cash=paymentsDay.filter(p=>p.method==="Efectivo").reduce((s,p)=>s+(+p.amount||0),0);
    const bank=paymentsDay.filter(p=>p.method==="Transferencia").reduce((s,p)=>s+(+p.amount||0),0);
    const total=paymentsDay.reduce((s,p)=>s+(+p.amount||0),0);
    const tips=data.tips.filter(t=>tipBelongsToDate(t,date)).reduce((s,t)=>s+(+t.amount||0),0);
    html+=`<h2>Reporte diario · ${date}</h2><table><tr><th>Resumen</th><th>Monto</th></tr><tr><td>Total cobrado</td><td class="num">$${moneyXls(total)}</td></tr><tr><td>Efectivo</td><td class="num">$${moneyXls(cash)}</td></tr><tr><td>Transferencias</td><td class="num">$${moneyXls(bank)}</td></tr><tr><td>Propinas</td><td class="num">$${moneyXls(tips)}</td></tr></table>`;
    html+=`<h2>Servicios del día</h2><table><tr><th>Hora</th><th>Cliente</th><th>Dirección</th><th>Servicio</th><th>Importe</th><th>Pagado</th><th>Pendiente</th><th>Forma de pago</th><th>Estado</th></tr>`;
    rowsDaily.forEach(a=>{
      const c=client(a.clientId), pays=paymentsDay.filter(p=>p.appointmentId===a.id);
      const paid=pays.reduce((s,p)=>s+(+p.amount||0),0);
      html+=`<tr><td>${escXls(a.time||"")}</td><td>${escXls(c?.name||"")}</td><td>${escXls(c?.address||"")}</td><td>${escXls(a.serviceName||"Por definir")}</td><td class="num">$${moneyXls(a.total)}</td><td class="num">$${moneyXls(paid)}</td><td class="num">$${moneyXls(apptDue(a.id))}</td><td>${escXls(pays.map(p=>p.method).join(" + ")||"—")}</td><td>${a.courtesy?"Cortesía":apptDue(a.id)>0?"Pendiente":"Pagado"}</td></tr>`;
    });
    html+=`<tr class="total"><td colspan="4">TOTAL</td><td class="num">$${moneyXls(rowsDaily.reduce((s,a)=>s+(+a.total||0),0))}</td><td class="num">$${moneyXls(total)}</td><td class="num">$${moneyXls(rowsDaily.reduce((s,a)=>s+apptDue(a.id),0))}</td><td colspan="2"></td></tr></table>`;
  }else{
    const groups={};
    rowsMonth.forEach(a=>{
      const k=a.serviceName||"Por definir"; groups[k]??={importe:0,transfer:0,cash:0,pending:0,count:0};
      groups[k].importe+=+a.total||0; groups[k].count++;
      data.payments.filter(p=>p.appointmentId===a.id).forEach(p=>p.method==="Transferencia"?groups[k].transfer+=+p.amount||0:groups[k].cash+=+p.amount||0);
      groups[k].pending+=apptDue(a.id);
    });
    html+=`<h2>Reporte mensual · ${month}</h2><table><tr><th>Servicio</th><th>Servicios</th><th>Importe</th><th>Transferencia</th><th>Efectivo</th><th>Pendiente</th></tr>`;
    let ti=0,tt=0,tc=0,tp=0,tn=0;
    Object.entries(groups).forEach(([k,r])=>{ti+=r.importe;tt+=r.transfer;tc+=r.cash;tp+=r.pending;tn+=r.count;html+=`<tr><td>${escXls(k)}</td><td class="num">${r.count}</td><td class="num">$${moneyXls(r.importe)}</td><td class="num">$${moneyXls(r.transfer)}</td><td class="num">$${moneyXls(r.cash)}</td><td class="num">$${moneyXls(r.pending)}</td></tr>`});
    html+=`<tr class="total"><td>TOTAL</td><td class="num">${tn}</td><td class="num">$${moneyXls(ti)}</td><td class="num">$${moneyXls(tt)}</td><td class="num">$${moneyXls(tc)}</td><td class="num">$${moneyXls(tp)}</td></tr></table>`;
  }
  html+=`<p class="sub">Generado por Pits Admin · ${new Date().toLocaleString("es-MX")}</p></body></html>`;
  const blob=new Blob([html],{type:"application/vnd.ms-excel;charset=utf-8;"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=`reporte_${type==="daily"?"diario_"+date:"mensual_"+month}.xls`;
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
